{# Botón de acción del correo. Espera: url, texto, marca. #}
<table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="background:{{ marca.color_primario }};border-radius:8px;">
  <a href="{{ url }}" style="display:inline-block;padding:13px 22px;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;">{{ texto }}</a>
</td></tr></table>
<p style="margin:16px 0 0;font-size:13px;color:#666;line-height:1.5;">Si el botón no abre, copia este enlace en tu navegador:<br><a href="{{ url }}" style="color:{{ marca.color_primario }};word-break:break-all;">{{ url }}</a></p>
